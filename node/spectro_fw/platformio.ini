; Lantern spectrometer front-end — classic Arduino Uno (ATmega328P, 5 V).
; The Uno is the timing engine for the Hamamatsu C12880MA; the Jetson only reads lines of text.
;
;   pio run -t upload        (USB to the Uno; port auto-detected)
;   pio device monitor       (you should see "S,<seq>,<integ_us>,v0,...,v287" lines)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
