apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectral
  labels: { app: spectral }
spec:
  replicas: 1
  strategy: { type: Recreate }          # one serial port, one owner
  selector:
    matchLabels: { app: spectral }
  template:
    metadata:
      labels: { app: spectral }
    spec:
      hostNetwork: true                 # UDP uplink + :8081 reachable from the LAN without a Service
      terminationGracePeriodSeconds: 5
      containers:
        - name: spectral
          image: quay.io/CHANGEME/lantern-spectral:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: spectral-config }
          securityContext:
            privileged: true            # v1: simplest way to own /dev/spectro and /dev/xbee; device plugin is the v2 cleanup
            runAsUser: 0
          volumeMounts:
            - { name: dev-spectro, mountPath: /dev/spectro }
            - { name: dev-xbee,    mountPath: /dev/xbee }
            - { name: telemetry,   mountPath: /var/telemetry }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
      volumes:
        - name: dev-spectro
          hostPath: { path: /dev/spectro, type: CharDevice }
        - name: dev-xbee
          hostPath: { path: /dev/xbee, type: CharDevice }
        - name: telemetry
          hostPath: { path: /var/telemetry, type: DirectoryOrCreate }
