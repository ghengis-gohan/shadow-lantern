# Baked into the node image at /etc/microshift/manifests/ — MicroShift applies it on every boot.
# Change the image tag here, rebuild the OS image, `bootc upgrade`: that is the app deploy path for v1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lantern
resources:
  - namespace.yaml
  - configmap.yaml
  - spectral-deployment.yaml
images:
  - name: quay.io/CHANGEME/lantern-spectral
    newTag: "0.1"
