apiVersion: v1
kind: ConfigMap
metadata:
  name: spectral-config
data:
  NODE_ID: "spec-1"
  # The Uno, by stable udev name (see os/files/etc/udev/rules.d/99-lantern.rules)
  SPECTRO_SOURCE: "serial:///dev/spectro?baud=115200"
  # Bench: UDP to the ground station over WiFi. Field: the XBee.
  UPLINK: "udp://192.168.1.50:5005"
  # UPLINK: "serial:///dev/xbee?baud=9600"
  TELEMETRY_DB: "/var/telemetry/spectral.db"
  DARK_FILE: "/var/telemetry/dark.npy"
  RECORD_FILE: "/var/telemetry/frames.txt"      # raw frames for replay + training; empty string disables
  MATCH_TOL_NM: "8"
  NOVELTY_THRESHOLD: "0.35"
  BULK_PERIOD_S: "2"
